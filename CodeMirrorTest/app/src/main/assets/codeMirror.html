<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Editor - Guaranteed Working</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .editor-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #1e1e1e;
        }

        .toolbar {
            background: #2d2d2d;
            padding: 10px 15px;
            border-bottom: 1px solid #444;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
        }

        .toolbar .title {
            color: #61dafb;
            font-weight: 600;
        }

        .toolbar .status {
            color: #888;
            font-size: 12px;
        }

        .editor-wrapper {
            flex: 1;
            position: relative;
            background: #2d2d2d;
        }

        .line-numbers {
            position: absolute;
            left: 0;
            top: 0;
            width: 50px;
            height: 100%;
            background: #252525;
            color: #666;
            font-family: 'Courier New', Monaco, monospace;
            font-size: 14px;
            line-height: 1.5;
            padding: 15px 8px;
            border-right: 1px solid #444;
            user-select: none;
            overflow: hidden;
        }

        .editor {
            position: absolute;
            left: 50px;
            top: 0;
            right: 0;
            bottom: 0;
            background: #2d2d2d;
            color: #e1e1e1;
            border: none;
            padding: 15px;
            font-family: 'Courier New', Monaco, monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
            white-space: pre;
            tab-size: 4;
        }

        .editor:focus {
            background: #2d2d2d;
        }

        /* Syntax highlighting with CSS (basic) */
        .syntax-highlight {
            position: absolute;
            left: 50px;
            top: 0;
            right: 0;
            bottom: 0;
            padding: 15px;
            font-family: 'Courier New', Monaco, monospace;
            font-size: 14px;
            line-height: 1.5;
            pointer-events: none;
            white-space: pre;
            overflow: hidden;
            color: transparent;
        }

        .keyword { color: #ff79c6; }
        .string { color: #f1fa8c; }
        .comment { color: #6272a4; font-style: italic; }
        .number { color: #bd93f9; }
        .function { color: #50fa7b; }
    </style>
</head>
<body>
<div class="editor-container">
    <div class="toolbar">
        <span class="title">📝 Code Editor</span>
        <span class="status" id="status">Ready - Line 1, Column 1</span>
    </div>

    <div class="editor-wrapper">
        <div class="line-numbers" id="line-numbers"></div>
        <textarea class="editor" id="editor" spellcheck="false"></textarea>
    </div>
</div>

<script>
    const editor = document.getElementById('editor');
    const lineNumbers = document.getElementById('line-numbers');
    const status = document.getElementById('status');

    const initialCode = `// Welcome to CodeMirror 6 on Android!
function greetUser(name) {
console.log(\`Hello, \${name}! Welcome to mobile coding.\`);

// You can edit this code
const features = [
    'Syntax highlighting',
    'Line numbers',
    'Mobile-friendly',
    'Dark theme',
    'No external dependencies'
];

features.forEach((feature, index) => {
    console.log(\`\${index + 1}. \${feature}\`);
});

return \`Thanks for trying this editor on Android!\`;
}

// Try calling the function
greetUser('Developer');

class CodeEditor {
constructor() {
    this.features = [
        'Syntax highlighting',
        'Auto indentation',
        'Mobile optimized',
        'Offline capable'
    ];
}

getFeatures() {
    return this.features;
}
}

const myEditor = new CodeEditor();
console.log('Editor features:', myEditor.getFeatures());

// Add your own code below:
`;

    editor.value = initialCode;

    // Update line numbers
    function updateLineNumbers() {
        const lines = editor.value.split('\n');
        const lineCount = lines.length;
        let lineNumbersHTML = '';

        for (let i = 1; i <= lineCount; i++) {
            lineNumbersHTML += i + '\n';
        }

        lineNumbers.textContent = lineNumbersHTML;
    }

    // Update status bar
    function updateStatus() {
        const cursorPos = editor.selectionStart;
        const textBeforeCursor = editor.value.substring(0, cursorPos);
        const lines = textBeforeCursor.split('\n');
        const currentLine = lines.length;
        const currentColumn = lines[lines.length - 1].length + 1;
        const totalLines = editor.value.split('\n').length;

        status.textContent = `Line ${currentLine}, Column ${currentColumn} - ${totalLines} lines total`;
    }

    // Handle tab key for indentation
    editor.addEventListener('keydown', function(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            const start = this.selectionStart;
            const end = this.selectionEnd;

            // Insert tab character
            this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
            this.selectionStart = this.selectionEnd = start + 4;
        }
    });

    // Update line numbers and status on input
    editor.addEventListener('input', function() {
        updateLineNumbers();
        updateStatus();
    });

    // Update status on cursor movement
    editor.addEventListener('keyup', updateStatus);
    editor.addEventListener('mouseup', updateStatus);

    // Android interface functions
    window.getEditorContent = () => {
        return editor.value;
    };

    window.setEditorContent = (content) => {
        editor.value = content;
        updateLineNumbers();
        updateStatus();
    };

    // Initialize
    updateLineNumbers();
    updateStatus();

    console.log('Code editor loaded successfully!');
    console.log('Available functions:');
    console.log('- getEditorContent(): Get current code');
    console.log('- setEditorContent(code): Set new code');

    // Auto-resize handling for mobile
    function handleResize() {
        const container = document.querySelector('.editor-container');
        container.style.height = window.innerHeight + 'px';
    }

    window.addEventListener('resize', handleResize);
    handleResize();
</script>
</body>
</html>
